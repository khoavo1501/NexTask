name: nextask-public

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 4000
  MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/nextask?replicaSet=rs0&authSource=admin
  MONGODB_REPLICA_SET: rs0
  CORS_ORIGIN: https://${PUBLIC_DOMAIN}
  LOG_LEVEL: info
  SERVICE_VERSION: ${SERVICE_VERSION:-1.0.1}
  JWT_SECRET: ${JWT_SECRET}
  COOKIE_SECURE: 'true'
  TRUST_PROXY: '2'
  AUTH_RATE_LIMIT_MAX: 5

x-seed-environment: &seed-environment
  NODE_ENV: development
  MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/nextask?replicaSet=rs0&authSource=admin
  MONGODB_REPLICA_SET: rs0
  CORS_ORIGIN: https://${PUBLIC_DOMAIN}
  LOG_LEVEL: info
  SERVICE_VERSION: 1.0.1
  JWT_SECRET: ${JWT_SECRET}
  COOKIE_SECURE: 'true'
  SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL}
  SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD}
  SEED_OWNER_NAME: ${SEED_OWNER_NAME}
  SEED_DEMO_MEMBER_PASSWORD: ${SEED_DEMO_MEMBER_PASSWORD}

services:
  mongo-key-init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        if [ ! -s /key/keyfile ]; then
          head -c 756 /dev/urandom | base64 > /key/keyfile
        fi
        chmod 400 /key/keyfile
        chown 999:999 /key/keyfile
    volumes:
      - mongo-keyfile:/key
    restart: 'no'
    logging: *default-logging

  mongo:
    image: mongo:8.0
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --auth
      - --keyFile
      - /etc/mongo/keyfile
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - mongo-keyfile:/etc/mongo:ro
    depends_on:
      mongo-key-init:
        condition: service_completed_successfully
    networks:
      - internal
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'
          -u "$$MONGO_ROOT_USERNAME" -p "$$MONGO_ROOT_PASSWORD"
          --authenticationDatabase admin | grep 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mongo-bootstrap:
    image: mongo:8.0
    profiles: ['bootstrap']
    command: [mongod, --replSet, rs0, --bind_ip_all]
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./deploy/mongo/bootstrap.js:/scripts/bootstrap.js:ro
    networks:
      internal:
        aliases:
          - mongo
    restart: 'no'
    logging: *default-logging

  migrate:
    build: *api-build
    command: ['node', 'dist/db/migrate.js']
    environment: *seed-environment
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal
    restart: 'no'
    logging: *default-logging

  seed:
    build: *api-build
    command: ['node', 'dist/db/seed-demo.js']
    environment: *seed-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    restart: 'no'
    logging: *default-logging

  api:
    build: *api-build
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${PUBLIC_DOMAIN}/api/v1
        NEXT_PUBLIC_TLDRAW_LICENSE_KEY: ${NEXT_PUBLIC_TLDRAW_LICENSE_KEY}
    environment:
      API_INTERNAL_URL: http://api:4000/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  public-proxy:
    image: caddy:2
    volumes:
      - ./deploy/Caddyfile.public:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      public-proxy:
        condition: service_started
    networks:
      - edge
      - internal
    restart: unless-stopped
    logging: *default-logging

networks:
  edge:
  internal:
    internal: true

volumes:
  mongo-data:
  mongo-keyfile:
