name: nextask

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 4000
  MONGODB_URI: mongodb://mongo:27017/nextask?replicaSet=rs0
  MONGODB_REPLICA_SET: rs0
  CORS_ORIGIN: http://localhost:3000
  LOG_LEVEL: info
  SERVICE_VERSION: 0.4.0
  JWT_SECRET: local-dev-only-nextask-jwt-secret-change-me
  COOKIE_SECURE: 'false'
  SEED_OWNER_EMAIL: owner@nextask.local
  SEED_OWNER_PASSWORD: nextask-local-owner-2026
  SEED_OWNER_NAME: Demo Owner

services:
  mongo:
    image: mongo:8.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval "try { db.adminCommand({ ping: 1 }).ok } catch (e) { 0 }" | grep 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./docker/mongo/init-replica.js:/scripts/init-replica.js:ro
    entrypoint:
      ['mongosh', '--host', 'mongo:27017', '--quiet', '--file', '/scripts/init-replica.js']
    restart: on-failure:5

  migrate:
    build: *api-build
    command: ['node', 'dist/db/migrate.js']
    environment: *api-environment
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: 'no'

  api:
    build: *api-build
    environment: *api-environment
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    environment:
      API_INTERNAL_URL: http://api:4000/api/v1
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  mongo-data:
